# Deploy Strapi from monorepo root (Railway Root Directory can stay "/")
# Prefer setting Root Directory to "backend" in the Railway UI when possible.

[build]
builder = "RAILPACK"
buildCommand = "npm ci --prefix backend && npm run build --prefix backend"

[deploy]
startCommand = "npm run start --prefix backend"
healthcheckPath = "/_health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
